name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v4

      - name: Outils
        run: |
          luarocks install luacheck
          luarocks install busted

      - name: Luacheck
        run: luacheck .

      - name: Tests
        run: busted tests
