name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lua 5.1 (celui de WoW) et LuaRocks viennent des paquets du système : plus de téléchargement depuis lua.org,
      # dont les coupures faisaient échouer la CI au hasard.
      - name: Lua et LuaRocks
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks

      - name: Outils
        run: |
          sudo luarocks --lua-version=5.1 install luacheck
          sudo luarocks --lua-version=5.1 install busted

      - name: Versions
        run: |
          lua5.1 -v
          luacheck --version
          busted --version

      - name: Luacheck
        run: luacheck .

      - name: Tests
        run: busted tests
